{% extends 'base.html' %}

{% block title %}회원가입 - Roller{% endblock %}

{% block head %}
<script>

if (window.Kakao && !Kakao.isInitialized()) {
    Kakao.init('YOUR_KAKAO_JS_KEY');
}

window.__FIREBASE_CONFIG__ = window.__FIREBASE_CONFIG__ || null;
</script>
{% endblock %}

{% block content %}
    <main class="auth-page">
        <div class="auth-card">
            <h1 class="auth-title">회원가입</h1>
            {% if error %}
            <div class="auth-error">{{ error }}</div>
            {% endif %}
            {% if success %}
            <div class="auth-success">{{ success }}</div>
            {% endif %}
            <form method="post" action="{{ url_for('signup') }}">
                <label class="auth-label">아이디
                    <input name="username" type="text" class="auth-input" placeholder="아이디를 입력하세요">
                </label>

                <label class="auth-label">이메일
                    <input name="email" type="email" class="auth-input" placeholder="이메일">
                </label>

                <label class="auth-label">비밀번호
                    <input name="password" type="password" class="auth-input" placeholder="비밀번호">
                </label>

                <label class="auth-label">비밀번호 확인
                    <input name="password2" type="password" class="auth-input" placeholder="비밀번호 확인">
                </label>

                <button type="submit" class="auth-submit">회원가입</button>
            </form>

            <div style="margin:12px 0; display:flex; gap:8px; flex-direction:column;">
                <button class="auth-submit" type="button" onclick="googleSignIn()">Google로 회원가입 / 로그인</button>
                <button class="auth-submit" type="button" onclick="kakaoSignIn()">Kakao로 회원가입 / 로그인</button>
            </div>

            <div class="auth-links">
                <a href="{{ url_for('login') }}">로그인</a>
                <a href="/">홈으로</a>
            </div>
        </div>
    </main>
{% endblock %}
